function available(r,p){const b=r.base;return p==='全部'||(p==='高失竊'?!!b.G:p==='汰換'?!!b.H:p==='職安'?['I','J','K','L'].some(k=>!!b[k]):r.hasSmall||!!b.M)}
function hasHost(r){return !!(r.hosts.length||r.hostSummaries.length)}
function findStores(query,project){const q=norm(query);return DATA.filter(r=>(!r.closed||$('showClosed').checked)&&(!$('dept').value||r.dept===$('dept').value)&&(!$('area').value||r.area===$('area').value)&&(!$('hostsOnly').checked||hasHost(r))&&([r.name,r.id,...r.aliases].some(v=>norm(v).includes(q)))&&available(r,project))}
function resetRegions(){const current=$('area').value;const opts=[...new Set(DATA.filter(r=>!$('dept').value||r.dept===$('dept').value).map(r=>r.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('area').replaceChildren(new Option('全部區',''));for(const a of opts)$('area').append(new Option(a,a));if(opts.includes(current))$('area').value=current;}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){const rows=findStores($('q').value,selected),pending=rows.filter(r=>r.pending).length,closed=rows.filter(r=>r.closed).length;const confirmed=rows.length-pending-closed;$('count').textContent=`符合 ${confirmed} 間營業所${closed?' · 已關店 '+closed+' 間':''}${pending?' · 門市對應待確認 '+pending+' 筆':''}（全名單：營業所 361 間）`;$('results').replaceChildren();for(const r of rows.slice(0,limit)){const b=el('button','store');b.type='button';b.append(el('span','arrow','查看 ›'),el('span','meta',`${r.id||'代號未提供'} · ${r.dept} · ${r.area}`),el('strong','',r.name));const tags=el('div','tags');if(r.closed)tags.append(el('span','tag closed-tag','已關店'));if(r.pending)tags.append(el('span','tag pending-tag','門市對應待確認'));if(hasHost(r))tags.append(el('span','tag','監控主機'));for(const p of LABELS.slice(1))if(available(r,p))tags.append(el('span','tag',p));if(!tags.children.length)tags.append(el('span','meta','未提供主機資料'));b.append(tags);b.addEventListener('click',()=>openStore(r));$('results').append(b)}if(!rows.length)$('results').append(el('div','empty','找不到符合的營業所，請試試部分店名或清除篩選。'));$('more').hidden=rows.length<=limit}

function panel(title,source,fields,state){const p=el('section','panel'),h=el('h3','',title);if(state)h.append(el('span','state',state));p.append(h,el('div','hint',source));for(const [label,value] of fields){const line=el('div','line');line.append(el('span','',label),el('span','',value||'未填'));p.append(line)}return p}
function openStore(r){const b=r.base,s=r.small;$('storeName').textContent=r.name;$('storeMeta').textContent=`${r.id||'代號未提供'} · ${r.dept} · ${r.area}`;const content=$('detailBody');content.replaceChildren();
if(r.closed)content.append(el('p','summary-note','已關店：僅供歷史資料查詢，不列入營業中家數及施工統計。'));
if(r.pending)content.append(el('p','summary-note','此名稱僅出現在 G216／G5016 統計表，尚未確認對應門市及代號。獨立保留來源資料，不與其他門市合併、不列入營業所家數。'));
if(r.deptInferred)content.append(el('p','hint','主機總表未列出此門市；處別依原專案區別與主機表的區處對照補入。'));
if(r.hostRecords.length>1)content.append(el('p','summary-note','主機總表有多筆來源名稱，依已確認名稱歸於同一門市。以下分列原表紀錄，未將主機數量相加，請依現場核對。'));
if(r.hostRecords.length){for(const rec of r.hostRecords){const section=panel('監控主機資料','來源：全聯－監控主機總表',[['原表名稱',rec.name],['原表處／區',`${rec.dept}／${rec.area}`],['營業所備註',rec.note]]);if(rec.area!==r.area)section.append(el('p','warning',`專案表區別為「${r.area}」，主機表為「${rec.area}」；區篩選沿用專案表區別，兩者並列供核對。`));for(const [i,h]of rec.hosts.entries()){section.append(el('h4','host-title',`${i+1}. ${h.location||'位置未填'}`));for(const[label,value]of [['主機型號',h.model],['安裝／更換原始紀錄',h.history]]){const line=el('div','line');line.append(el('span','',label),el('span','',value||'未填'));section.append(line)}}content.append(section)}}
else if(!r.pending)content.append(panel('監控主機資料','來源：全聯－監控主機總表',[['資料狀態','此表未提供本門市的主機明細']]));
for(const summary of r.hostSummaries)content.append(panel('主機型號統計（'+summary.model+'）','來源：門市監控統計－G216＆G5016；與主機明細分開保留，不互相覆蓋。',[['原表監控主機總台數',summary.total],['原表 '+summary.model+' 台數',summary.count],['原表備註',summary.note]]));
if(!r.hasBase)content.append(el('p','warning',r.hasSmall?'此營業所由小時達清單新增，其他三個專案未提供資料。':'此紀錄未提供四個專案資料。'));
content.append(panel('高失竊','來源：監視器總表',[['增加鏡頭數量',b.G]]));
content.append(panel('類比汰換','來源：監視器總表',[['梯次／原始註記',b.H]]));
content.append(panel('職安／門市風險','來源：監視器總表',[['第一年／梯次註記',b.I],['增加鏡頭數量',b.J],['鏡頭轉向／位移',b.K],['增加主機數量',b.L]]));
content.append(panel('小時達交付區',r.hasSmall?'來源：小時達清單':'小時達清單未列入此門市',[['增加鏡頭數量',s.I],['增加主機數量',s.H],['排程',s.J],['預計施作日期',s.K],['實際完成日期',s.L],['施工備註',s.N],['監視器總表的小時達完成日',b.M]],s.L?'已填完成日期':'未填完成日期'));
if(s.L&&b.M&&s.L!==b.M)content.append(el('p','warning','兩份表的小時達完成日期不同，請人工核對；目前並列顯示。'));
if(r.hasBase)content.append(panel('總表施工記錄','此記錄未分開指定各專案，不套用為四個專案的完成日期。',[['排程',b.R],['實際施作日期',b.S]]));
content.append(el('p','hint','本版為原始資料查詢，手機施工回填與多人同步尚未啟用。'));$('detail').showModal();$('detail').scrollTop=0;}
for(const name of [...new Set(DATA.map(r=>r.dept))].sort((a,b)=>a.localeCompare(b,'zh-Hant')))$('dept').append(new Option(name,name));
resetRegions();$('dept').onchange=()=>{$('area').value='';resetRegions();limit=24;render()};$('area').onchange=()=>{limit=24;render()};for(const id of ['hostsOnly','showClosed'])$(id).onchange=()=>{limit=24;render()};
for(const p of LABELS){const b=el('button','',p);b.type='button';b.setAttribute('aria-pressed',String(p===selected));b.onclick=()=>{selected=p;limit=24;for(const x of $('filters').children)x.setAttribute('aria-pressed',String(x.textContent===p));render()};$('filters').append(b)}
$('q').addEventListener('input',()=>{limit=24;render()});$('clear').onclick=()=>{$('q').value='';limit=24;render();$('q').focus()};$('more').onclick=()=>{limit+=24;render()};$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close()}});render();
</script></body></html>
